# Scrapes /metrics from the hub's ops port (OPS_PORT, 9464) in every
# role. In Kubernetes replace static_configs with a ServiceMonitor /
# kubernetes_sd_configs on the same port.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: communication-hub-api
    static_configs:
      - targets: ['api:9464']
        labels: { role: api }

  - job_name: communication-hub-worker
    static_configs:
      - targets: ['worker:9464']
        labels: { role: worker }
