# Ships the hub's stdout (one JSON object per line, pino) to Loki.
#
# Labels are low-cardinality only: compose_service (api | worker), level,
# event, channel. High-cardinality fields (requestId, tenantId,
# notificationId, provider message ids) stay in the line and are filtered
# at query time with `| json`, e.g.
#   {compose_service="worker"} | json | notificationId="..."
server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: communication-hub
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        # Only containers that opt in (label logging=promtail, see docker-compose.yml).
        filters:
          - name: label
            values: ['logging=promtail']
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
    pipeline_stages:
      - json:
          expressions:
            level: level
            event: event
            channel: channel
            time: time
      - labels:
          level:
          event:
          channel:
      - timestamp:
          source: time
          format: RFC3339Nano
