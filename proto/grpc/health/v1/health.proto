// Standard gRPC health checking protocol
// (https://github.com/grpc/grpc/blob/master/doc/health-checking.md), so
// Kubernetes gRPC probes, grpc_health_probe and load balancers work as is.
// Only Check is implemented.
syntax = "proto3";

package grpc.health.v1;

message HealthCheckRequest {
  // "" = the whole server; or a service name, e.g.
  // "communication_hub.v1.NotificationService".
  string service = 1;
}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
    SERVICE_UNKNOWN = 3;
  }
  ServingStatus status = 1;
}

service Health {
  rpc Check(HealthCheckRequest) returns (HealthCheckResponse);
}
