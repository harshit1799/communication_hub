// Sender identities and sender selection rules (tenant API key).
//
// A tenant registers any number of senders per channel (email "From"
// addresses, SMS sender ids / numbers). Which one a notification uses:
//   1. NotificationInput.sender_id, if given
//   2. the first matching active SenderRule (template-specific rules
//      before general ones, then by ascending priority)
//   3. the tenant's default sender for the channel
//   4. the provider's own default (e.g. a Twilio Messaging Service)
// The address itself must be verified with the provider (SES identity,
// Twilio number, DLT registration, ...); the hub does not verify ownership.
syntax = "proto3";

package communication_hub.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "communication_hub/v1/common.proto";

service SenderService {
  rpc CreateSender(CreateSenderRequest) returns (Sender);
  rpc ListSenders(ListSendersRequest) returns (ListSendersResponse);
  rpc UpdateSender(UpdateSenderRequest) returns (Sender);
  rpc DeleteSender(SenderRef) returns (google.protobuf.Empty);

  rpc CreateSenderRule(CreateSenderRuleRequest) returns (SenderRule);
  rpc ListSenderRules(ListSenderRulesRequest) returns (ListSenderRulesResponse);
  rpc DeleteSenderRule(SenderRuleRef) returns (google.protobuf.Empty);
}

message Sender {
  string id = 1;
  // EMAIL or SMS (push has no sender).
  Channel channel = 2;
  // "Acme <no-reply@acme.com>" for email, "+14155550100" / "ACME" for SMS.
  string value = 3;
  optional string label = 4;
  // Send through this provider config when set (e.g. a number that only
  // exists in one Twilio account); otherwise providers in priority order.
  optional string provider_config_id = 5;
  bool is_default = 6;
  bool active = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message CreateSenderRequest {
  Channel channel = 1;
  string value = 2;
  optional string label = 3;
  optional string provider_config_id = 4;
  // Becomes the channel default (the previous default is unset).
  bool is_default = 5;
}

message ListSendersRequest {
  Channel channel = 1;
}

message ListSendersResponse {
  repeated Sender senders = 1;
}

message UpdateSenderRequest {
  string id = 1;
  optional string label = 2;
  optional bool is_default = 3;
  optional bool active = 4;
  optional string provider_config_id = 5;
}

message SenderRef {
  string id = 1;
}

enum SenderRuleMatch {
  SENDER_RULE_MATCH_UNSPECIFIED = 0;
  // Always matches (use with template_id: "this template uses this sender").
  SENDER_RULE_MATCH_ANY = 1;
  // SMS: recipient starts with match_value, e.g. "+91".
  SENDER_RULE_MATCH_RECIPIENT_PREFIX = 2;
  // Email: recipient domain equals match_value, e.g. "gmail.com".
  SENDER_RULE_MATCH_RECIPIENT_DOMAIN = 3;
}

message SenderRule {
  string id = 1;
  Channel channel = 2;
  // Only for this template; unset = every send on the channel.
  optional string template_id = 3;
  SenderRuleMatch match = 4;
  optional string match_value = 5;
  string sender_id = 6;
  // Lower runs first.
  int32 priority = 7;
  google.protobuf.Timestamp created_at = 8;
}

message CreateSenderRuleRequest {
  Channel channel = 1;
  optional string template_id = 2;
  SenderRuleMatch match = 3;
  optional string match_value = 4;
  string sender_id = 5;
  int32 priority = 6;
}

message ListSenderRulesRequest {
  Channel channel = 1;
}

message ListSenderRulesResponse {
  repeated SenderRule rules = 1;
}

message SenderRuleRef {
  string id = 1;
}
